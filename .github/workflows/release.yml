name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-backend:
    name: Backend (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_name: parlaguesser-backend-linux-amd64
          - goos: linux
            goarch: arm64
            asset_name: parlaguesser-backend-linux-arm64
          - goos: darwin
            goarch: amd64
            asset_name: parlaguesser-backend-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset_name: parlaguesser-backend-darwin-arm64
          - goos: windows
            goarch: amd64
            asset_name: parlaguesser-backend-windows-amd64.exe
          - goos: windows
            goarch: arm64
            asset_name: parlaguesser-backend-windows-arm64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Build release binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o "dist/${{ matrix.asset_name }}" .

      - name: Package binary
        shell: bash
        run: |
          cd dist
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            zip "${{ matrix.asset_name }}.zip" "${{ matrix.asset_name }}"
          else
            tar -czf "${{ matrix.asset_name }}.tar.gz" "${{ matrix.asset_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  release-frontend:
    name: PocketBase Cloud Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and verify PocketBase Cloud project
        run: bash scripts/build-pocketbase-cloud.sh

      - name: Verify PocketBase deployment structure
        run: |
          test -d pb_hooks
          test -d pb_migrations
          test -f pb_public/index.html

      - name: Package PocketBase Cloud bundle
        shell: bash
        run: |
          mkdir -p dist
          zip -r dist/parlaguesser-pocketbase-cloud.zip \
            main.go go.mod go.sum internal cmd pb_hooks pb_migrations pb_public pb_schema.json

      - name: Upload PocketBase Cloud artifact
        uses: actions/upload-artifact@v4
        with:
          name: parlaguesser-pocketbase-cloud
          path: dist/parlaguesser-pocketbase-cloud.zip

      - name: Publish PocketBase Cloud bundle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/parlaguesser-pocketbase-cloud.zip
